name: Run tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test_and_coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: llvm-tools-preview
          toolchain: stable
          build-warnings: warn

      - name: Install llvm-cov
        env:
          LLVM_COV_RELEASES: https://github.com/taiki-e/cargo-llvm-cov/releases
        run: |
          host=$(rustc -Vv | grep host | sed 's/host: //')
          curl -fsSL $LLVM_COV_RELEASES/latest/download/cargo-llvm-cov-$host.tar.gz | tar xzf - -C "$HOME/.cargo/bin"

      - name: Test and generate coverage report
        run: ./tests/coverage.sh --ci --threads 2

      - name: Store the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.lcov
          if-no-files-found: error
          retention-days: 7

  upload_coverage:
    needs: test_and_coverage
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Retrieve the coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        timeout-minutes: 5
        with:
          fail_ci_if_error: true
          files: coverage.lcov
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
