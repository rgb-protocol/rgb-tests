[package]
name = "rgb-tests"
version = "0.1.0"
authors = [
    "Zoe Faltibà <zoefaltiba@gmail.com>",
    "Dr Maxim Orlovsky <orlovsky@lnp-bp.org>",
    "Nicola Busanello <nicola.busanello@gmail.com>",
]
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/rgb-protocol/rgb-tests"
homepage = "https://github.com/rgb-protocol/rgb-tests"
license = "Apache-2.0"
description = "RGB tests"

[dependencies]
amplify = "4.8.1"
bdk_wallet = { version = "3.1.0", features = [
    "file_store",
    "std",
] }
bdk_electrum = "0.24.0"
bdk_esplora = "0.22.2"
bitcoin_hashes = "1.0.0"
bp-electrum = { version = "=0.11.1-alpha.2" }
bp-wallet = { version = "=0.11.1-alpha.2", features = [
    "electrum",
    "esplora",
    "fs",
    "signers"
] }
chrono = "0.4.45"
crossbeam = "0.8.4"
dhat = { version = "0.3", optional = true }
file-format = { version = "0.29.0", features = [
    "reader",
] }
lazy_static = { version = "1.5.0", default-features = false }
libc = "0.2"
nix = { version = "0.31", features = [
    "process",
] }
once_cell = "1.21.4"
rand = "0.9.1"
rstest = "0.26.1"
rstest_reuse = "0.7.0"
serde = { version = "1", features = [
    "derive",
] }
serde_json = "1"
serial_test = "3.5.0"
signal-hook = "0.3"
strum = { version = "0.28.0", features = [
    "derive",
] }
sysinfo = "0.38"
time = "0.3.53"

# RGB-related deps
## rgb-api
rgb-api = { path = "./rgb-api", features = [
    "bp",
    "bdk",
    "bitcoind_blocking",
    "electrum_blocking",
    "esplora_blocking",
    "fs",
] }
rgb-psbt-utils = { path = "./rgb-api/psbt", features = [
    "bp",
] }
## aluvm
rgb-aluvm = { path = "./rgb-aluvm" }
## rgb-consensus
rgb-consensus = { path = "./rgb-consensus" }
## rgb-ops
rgb-ops = { path = "./rgb-ops", features = [
    "fs",
    "legacy",
] }
## rgb-schemas
rgb-schemas = { path = "./rgb-schemas" }
## strict-encoding
rgb-strict-encoding = { path = "./rgb-strict-encoding/rust" }
## strict-types
rgb-strict-types = { path = "./rgb-strict-types" }

[patch.crates-io]
# patching all RGB-related deps, to measure code coverage
## aluvm
rgb-aluvm = { path = "./rgb-aluvm" }
## ascii-armor
rgb-ascii-armor = { path = "./rgb-ascii-armor" }
## rgb-api
rgb-api = { path = "./rgb-api" }
rgb-psbt-utils = { path = "./rgb-api/psbt" }
## rgb-consensus
rgb-consensus = { path = "./rgb-consensus" }
## rgb-ops
rgb-ops = { path = "./rgb-ops" }
rgb-invoicing = { path = "./rgb-ops/invoice" }
## rgb-schemas
rgb-schemas = { path = "./rgb-schemas" }
## strict-encoding
rgb-strict-encoding = { path = "./rgb-strict-encoding/rust" }
rgb-strict-encoding-derive = { path = "./rgb-strict-encoding/rust/derive" }
## strict-types
rgb-strict-types = { path = "./rgb-strict-types" }

[features]
default = []
memprof = ["dep:dhat"] # enable memory profiling

[profile.reldebug]
inherits = "release"
debug = 1
